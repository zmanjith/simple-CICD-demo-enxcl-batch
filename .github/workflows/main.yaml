name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t simple-html-app .

      - name: Tag Image
        run: docker tag simple-html-app zmanjith/simple-html-app:v3

      - name: Push Image
        run: docker push zmanjith/simple-html-app:v3
